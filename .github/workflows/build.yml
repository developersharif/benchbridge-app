# Builds benchbridge installers (Linux, Windows, macOS) from a PINNED commit of the private
# source repository. This repository is PUBLIC, so the workflow is written to keep the source
# and build output out of public logs and artifacts. See README.md for setup and the security model.
#
# Status: written and statically checked; see README "Status" for what has/has not been run.
name: build-release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character commit SHA of developersharif/benchbridge (must be on its main branch)
        required: true
        type: string
      draft_release:
        description: Store the build as a DRAFT pre-release (recommended). If off, installers are only kept as artifacts for 3 days
        required: true
        type: boolean
        default: true

# Deny everything by default; each job asks only for what it needs.
permissions: {}

concurrency:
  group: build-release
  cancel-in-progress: false

env:
  SOURCE_REPO: developersharif/benchbridge
  RUST_TOOLCHAIN: "1.97.0"
  NODE_VERSION: "22"

jobs:
  verify-source:
    name: verify source commit
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
      version: ${{ steps.verify.outputs.version }}
    steps:
      - name: Check out build scripts (this repository)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
          path: tools
          persist-credentials: false
          show-progress: false
      - name: Check out source (full history, read-only deploy key)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.source_sha }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          fetch-depth: 0
          path: src
          persist-credentials: false
          show-progress: false
      - name: Verify commit is exact and on main
        id: verify
        env:
          SHA: ${{ inputs.source_sha }}
          SRC_DIR: src
        run: bash tools/scripts/verify-source.sh

  build:
    name: build (${{ matrix.name }})
    needs: verify-source
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            tauri_args: "--bundles deb,rpm"
            rust_targets: ""
          - name: windows
            os: windows-latest
            tauri_args: "--bundles nsis"
            rust_targets: ""
          - name: macos
            os: macos-latest
            tauri_args: "--target universal-apple-darwin --bundles dmg"
            rust_targets: "x86_64-apple-darwin aarch64-apple-darwin"
    steps:
      - name: Check out build scripts (this repository)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
          path: tools
          persist-credentials: false
          show-progress: false
      - name: Check out source at the verified commit (read-only deploy key)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.verify-source.outputs.sha }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          path: src
          persist-credentials: false
          show-progress: false
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev >/dev/null
      - name: Install pinned Rust toolchain
        env:
          RUST_TARGETS: ${{ matrix.rust_targets }}
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update >/dev/null 2>&1
          rustup default "$RUST_TOOLCHAIN" >/dev/null 2>&1
          for t in $RUST_TARGETS; do rustup target add "$t" >/dev/null 2>&1; done
          rustc --version
      - name: Set up Node.js (no dependency cache)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Build installers (tool output withheld)
        env:
          SRC_DIR: src
          OUT_DIR: dist
          TAURI_ARGS: ${{ matrix.tauri_args }}
          LOG_FILE: build.log
          ENC_DIR: enclog
          LOG_KEY: ${{ secrets.LOG_ENCRYPTION_KEY }}
          CARGO_TERM_COLOR: never
          CARGO_TERM_PROGRESS_WHEN: never
          # The source repo's rust-toolchain.toml says "stable" and would override `rustup default`
          # (auto-installing an unpinned toolchain without the macOS targets); this env var wins.
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
          CI: "true"
          # macOS signing + notarization (read by `tauri build`). Values come from the `release`
          # environment and are passed to the macOS leg only; empty elsewhere, so other legs stay unsigned.
          APPLE_CERTIFICATE: ${{ matrix.name == 'macos' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.name == 'macos' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.name == 'macos' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ matrix.name == 'macos' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ matrix.name == 'macos' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.name == 'macos' && secrets.APPLE_TEAM_ID || '' }}
        run: bash tools/scripts/build-installers.sh
      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.name }}
          path: dist/*
          retention-days: 3
          if-no-files-found: error
      - name: Upload encrypted build log (owner-only; ciphertext)
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: buildlog-${{ matrix.name }}-encrypted
          path: enclog/build-log.enc
          retention-days: 3
          if-no-files-found: ignore

  release:
    name: draft release
    if: ${{ inputs.draft_release }}
    needs: [verify-source, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write        # create the draft release
      id-token: write        # sign the provenance attestation
      attestations: write    # store the provenance attestation
    steps:
      - name: Download installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          merge-multiple: true
          path: dist
      - name: Write checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify-source.outputs.version }}
          SHA: ${{ needs.verify-source.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          short="${SHA:0:7}"
          cat > notes.md <<NOTES
          Early build of benchbridge ${VERSION} from source commit \`${short}\`.

          **macOS:** the app is signed with a Developer ID and notarized (check: \`spctl --assess -vv benchbridge.app\`); the \`.dmg\` file itself is not notarized.
          **Windows and Linux installers are unsigned**; Windows SmartScreen will warn.
          **No instrument has been verified with this software yet.** The demo mode uses synthetic data.

          Verify your download:

              sha256sum -c SHA256SUMS.txt
              gh attestation verify <file> --repo ${GITHUB_REPOSITORY}

          Built by ${RUN_URL}
          NOTES
          gh release create "v${VERSION}-${short}" dist/* \
            --repo "$GITHUB_REPOSITORY" --draft --prerelease \
            --title "benchbridge ${VERSION} (${short})" --notes-file notes.md
